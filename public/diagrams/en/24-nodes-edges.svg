<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" role="img" aria-label="Four node types and the five elements every edge must carry">
  <defs>
    <filter id="wb24"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="241" /><feDisplacementMap in="SourceGraphic" scale="1.5" /></filter>
    <style>
      .h   { font: 600 14px sans-serif; fill: #1e293b; }
      .lbl { font: 700 11.5px sans-serif; fill: #1e293b; }
      .t-s { font: 10.5px sans-serif; fill: #64748b; }
    </style>
  </defs>
  <text x="440" y="26" class="h" text-anchor="middle">Graph engineering: four node types + an edge's five elements</text>
  <text x="440" y="44" class="t-s" text-anchor="middle">Organizing work = split it across four node types, then spell out every handoff edge. About division &amp; handoff, not a graph framework</text>
  <g filter="url(#wb24)">
    
    <rect x="30" y="86" width="190" height="118" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="1.8" />
    <text x="125" y="116" class="lbl" text-anchor="middle">Agent node</text>
    <foreignObject x="42" y="128" width="166" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:10.5px sans-serif;color:#475569;margin:0;line-height:1.3;text-align:center">model execution with its own loop</p></foreignObject>
    <text x="125" y="192" class="t-s" text-anchor="middle">costly · slow · improvises</text>
    <rect x="240" y="86" width="190" height="118" rx="12" fill="#dcfce7" stroke="#1e293b" stroke-width="1.8" />
    <text x="335" y="116" class="lbl" text-anchor="middle">Code node</text>
    <foreignObject x="252" y="128" width="166" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:10.5px sans-serif;color:#475569;margin:0;line-height:1.3;text-align:center">deterministic code</p></foreignObject>
    <text x="335" y="192" class="t-s" text-anchor="middle">cheap · fast · testable</text>
    <rect x="450" y="86" width="190" height="118" rx="12" fill="#fef9c3" stroke="#1e293b" stroke-width="1.8" />
    <text x="545" y="116" class="lbl" text-anchor="middle">Tool node</text>
    <foreignObject x="462" y="128" width="166" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:10.5px sans-serif;color:#475569;margin:0;line-height:1.3;text-align:center">model-facing code interface (ACI)</p></foreignObject>
    <text x="545" y="192" class="t-s" text-anchor="middle">deterministic · fits the model</text>
    <rect x="660" y="86" width="190" height="118" rx="12" fill="#fee2e2" stroke="#1e293b" stroke-width="1.8" />
    <text x="755" y="116" class="lbl" text-anchor="middle">Human node</text>
    <foreignObject x="672" y="128" width="166" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:10.5px sans-serif;color:#475569;margin:0;line-height:1.3;text-align:center">approvals / judgment / info</p></foreignObject>
    <text x="755" y="192" class="t-s" text-anchor="middle">slowest, priciest · holds lines</text>
    <text x="60" y="256" class="lbl">one delegation edge carries five elements</text>
    
    <rect x="250" y="280" width="180" height="42" rx="8" fill="#e0e7ff" stroke="#1e293b" stroke-width="1.5" />
    <text x="340" y="306" class="lbl" text-anchor="middle">goal</text>
    <foreignObject x="450" y="284" width="380" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:11px sans-serif;color:#475569;margin:0;line-height:1.3">what to achieve, not how</p></foreignObject>
    <rect x="250" y="332" width="180" height="42" rx="8" fill="#e0e7ff" stroke="#1e293b" stroke-width="1.5" />
    <text x="340" y="358" class="lbl" text-anchor="middle">context</text>
    <foreignObject x="450" y="336" width="380" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:11px sans-serif;color:#475569;margin:0;line-height:1.3">what it needs to know, nothing more</p></foreignObject>
    <rect x="250" y="384" width="180" height="42" rx="8" fill="#e0e7ff" stroke="#1e293b" stroke-width="1.5" />
    <text x="340" y="410" class="lbl" text-anchor="middle">toolset</text>
    <foreignObject x="450" y="388" width="380" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:11px sans-serif;color:#475569;margin:0;line-height:1.3">allowlist — and only narrows, never widens</p></foreignObject>
    <rect x="250" y="436" width="180" height="42" rx="8" fill="#e0e7ff" stroke="#1e293b" stroke-width="1.5" />
    <text x="340" y="462" class="lbl" text-anchor="middle">budget</text>
    <foreignObject x="450" y="440" width="380" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:11px sans-serif;color:#475569;margin:0;line-height:1.3">max steps / spend</p></foreignObject>
    <rect x="250" y="488" width="180" height="42" rx="8" fill="#e0e7ff" stroke="#1e293b" stroke-width="1.5" />
    <text x="340" y="514" class="lbl" text-anchor="middle">output format</text>
    <foreignObject x="450" y="492" width="380" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:11px sans-serif;color:#475569;margin:0;line-height:1.3">the shape back — evidence, not just a verdict</p></foreignObject>
  </g>
  <text x="440" y="552" class="t-s" text-anchor="middle">No goal → drift · no context → guess · no perms → overreach · no budget → runaway · no format → duplicated work</text>
</svg>
