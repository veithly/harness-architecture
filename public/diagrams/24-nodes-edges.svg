<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" role="img" aria-label="四类节点与边上必带的五要素">
  <defs>
    <filter id="wb24"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="241" /><feDisplacementMap in="SourceGraphic" scale="1.5" /></filter>
    <style>
      .h   { font: 600 14px sans-serif; fill: #1e293b; }
      .lbl { font: 700 11.5px sans-serif; fill: #1e293b; }
      .t-s { font: 10.5px sans-serif; fill: #64748b; }
    </style>
  </defs>
  <text x="440" y="26" class="h" text-anchor="middle">图工程：四类节点 + 一条边的五要素</text>
  <text x="440" y="44" class="t-s" text-anchor="middle">组织工作 = 把活分给四类节点，再把每条交接边说清楚。重点是分工与交接，不是某个图框架</text>
  <g filter="url(#wb24)">
    
    <rect x="30" y="86" width="190" height="118" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="1.8" />
    <text x="125" y="116" class="lbl" text-anchor="middle">Agent 节点</text>
    <foreignObject x="42" y="128" width="166" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:10.5px sans-serif;color:#475569;margin:0;line-height:1.3;text-align:center">带自主循环的模型执行</p></foreignObject>
    <text x="125" y="192" class="t-s" text-anchor="middle">贵 · 慢 · 会即兴</text>
    <rect x="240" y="86" width="190" height="118" rx="12" fill="#dcfce7" stroke="#1e293b" stroke-width="1.8" />
    <text x="335" y="116" class="lbl" text-anchor="middle">代码节点</text>
    <foreignObject x="252" y="128" width="166" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:10.5px sans-serif;color:#475569;margin:0;line-height:1.3;text-align:center">确定性代码</p></foreignObject>
    <text x="335" y="192" class="t-s" text-anchor="middle">便宜 · 快 · 可测试</text>
    <rect x="450" y="86" width="190" height="118" rx="12" fill="#fef9c3" stroke="#1e293b" stroke-width="1.8" />
    <text x="545" y="116" class="lbl" text-anchor="middle">工具节点</text>
    <foreignObject x="462" y="128" width="166" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:10.5px sans-serif;color:#475569;margin:0;line-height:1.3;text-align:center">面向模型的代码接口 ACI</p></foreignObject>
    <text x="545" y="192" class="t-s" text-anchor="middle">确定性 · 迁就模型习惯</text>
    <rect x="660" y="86" width="190" height="118" rx="12" fill="#fee2e2" stroke="#1e293b" stroke-width="1.8" />
    <text x="755" y="116" class="lbl" text-anchor="middle">人工节点</text>
    <foreignObject x="672" y="128" width="166" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:10.5px sans-serif;color:#475569;margin:0;line-height:1.3;text-align:center">审批 / 拿主意 / 补信息</p></foreignObject>
    <text x="755" y="192" class="t-s" text-anchor="middle">最慢最贵 · 守边界</text>
    <text x="60" y="256" class="lbl">一条委派边必带五要素</text>
    
    <rect x="250" y="280" width="180" height="42" rx="8" fill="#e0e7ff" stroke="#1e293b" stroke-width="1.5" />
    <text x="340" y="306" class="lbl" text-anchor="middle">目标 goal</text>
    <foreignObject x="450" y="284" width="380" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:11px sans-serif;color:#475569;margin:0;line-height:1.3">要达成什么，不是怎么做</p></foreignObject>
    <rect x="250" y="332" width="180" height="42" rx="8" fill="#e0e7ff" stroke="#1e293b" stroke-width="1.5" />
    <text x="340" y="358" class="lbl" text-anchor="middle">上下文 context</text>
    <foreignObject x="450" y="336" width="380" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:11px sans-serif;color:#475569;margin:0;line-height:1.3">需要知道的背景，仅此而已</p></foreignObject>
    <rect x="250" y="384" width="180" height="42" rx="8" fill="#e0e7ff" stroke="#1e293b" stroke-width="1.5" />
    <text x="340" y="410" class="lbl" text-anchor="middle">权限 toolset</text>
    <foreignObject x="450" y="388" width="380" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:11px sans-serif;color:#475569;margin:0;line-height:1.3">白名单——且只收窄，不放宽</p></foreignObject>
    <rect x="250" y="436" width="180" height="42" rx="8" fill="#e0e7ff" stroke="#1e293b" stroke-width="1.5" />
    <text x="340" y="462" class="lbl" text-anchor="middle">预算 budget</text>
    <foreignObject x="450" y="440" width="380" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:11px sans-serif;color:#475569;margin:0;line-height:1.3">最多跑多少步 / 花多少</p></foreignObject>
    <rect x="250" y="488" width="180" height="42" rx="8" fill="#e0e7ff" stroke="#1e293b" stroke-width="1.5" />
    <text x="340" y="514" class="lbl" text-anchor="middle">输出格式</text>
    <foreignObject x="450" y="492" width="380" height="40"><p xmlns="http://www.w3.org/1999/xhtml" style="font:11px sans-serif;color:#475569;margin:0;line-height:1.3">回什么形状，含依据不止结论</p></foreignObject>
  </g>
  <text x="440" y="552" class="t-s" text-anchor="middle">缺目标会跑偏 · 缺上下文会瞎猜 · 缺权限会越权 · 缺预算会跑飞 · 缺格式会重复劳动</text>
</svg>
